name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: production (min/obfuscated) or raw (unminified)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - raw
  schedule:
    - cron: '0 */1 * * *'

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get release version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check release version
        run: echo "Release version is ${{ steps.get_version.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install dependencies
        run: npm install --production

      - name: Type check
        run: npm run check

      # ------------------------------------------------------------
      # Production build (minified/obfuscated) – default for schedule
      # ------------------------------------------------------------
      - name: Build production (min/obfuscated)
        if: ${{ github.event.inputs.build_mode != 'raw' }}
        run: npm run build
        env:
          NODE_ENV: obfuscate   # or keep your default 'mangle'

      # ------------------------------------------------------------
      # Raw build (unminified, unobfuscated) – when explicitly requested
      # ------------------------------------------------------------
      - name: Build raw (readable)
        if: ${{ github.event.inputs.build_mode == 'raw' }}
        run: npm run build
        env:
          BUILD_RAW: true

      # ------------------------------------------------------------
      # Always rename the output so we know which mode we produced
      # ------------------------------------------------------------
      - name: Prepare assets for release
        run: |
          mkdir -p dist-release
          if [ "${{ github.event.inputs.build_mode }}" == "raw" ]; then
            cp dist/worker.js dist-release/worker-raw.js
            cp dist/worker.zip dist-release/worker-raw.zip
          else
            cp dist/worker.js dist-release/worker.js
            cp dist/worker.zip dist-release/worker.zip
          fi

      - name: Read release note
        id: read_release
        shell: bash
        run: |
          r=$(cat RELEASE.md)         
          r="${r//'%'/'%25'}"                               
          r="${r//$'\n'/'%0A'}"                             
          r="${r//$'\r'/'%0D'}"                             
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist-release/*
          tag: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          overwrite: true
          file_glob: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          promote: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: ${{ steps.read_release.outputs.RELEASE_BODY }}
